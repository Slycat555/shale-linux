# Never put sound cards or USB audio to sleep when nothing is playing (no pops, no delay
# when sound starts again).
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_input.*" }, { node.name = "~alsa_output.*" } ]
        actions = { update-props = { session.suspend-timeout-seconds = 0 } }
    }
]
