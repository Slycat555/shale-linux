# Windows games (Proton/Wine) often ask for tiny audio buffers (~5 ms), so their sound
# crackles whenever loading keeps them busy. Give them at least ~43 ms instead.
pulse.rules = [
    {
        matches = [ { application.process.binary = "~wine.*" } ]
        actions = { update-props = { pulse.min.quantum = 2048/48000 } }
    }
]
