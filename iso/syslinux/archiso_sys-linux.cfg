LABEL arch
TEXT HELP
Start Shale Linux. You can try it out and install it from the desktop.
ENDTEXT
MENU LABEL Start Shale Linux (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0 %KERNEL_PARAMS%

LABEL archsafe
TEXT HELP
Use this if the screen stays black or garbled with the normal option.
ENDTEXT
MENU LABEL Start Shale Linux (safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
